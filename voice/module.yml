name: voice
version: 1.0.0
description: Speech-to-text via OpenAI Whisper API
category: voice
provides: [voice]
requires: []
port: 3005
healthcheck:
  path: /health
  port: 3005
env:
  OPENAI_API_KEY:
    required: true
    description: OpenAI API key for Whisper
    secret: true
compose:
  build: ./voice
  networks: [aikit]
